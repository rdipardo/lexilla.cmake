language: cpp
os: linux
dist: focal
compiler:
  - clang
  - gcc
script:
  - cd lexilla/scripts
  - ./RunTest.sh
jobs:
  include:
    - os: osx
      env:
        - CLANG=1
        - CODE_SIGN_IDENTITY=""
        - CODE_SIGNING_REQUIRED="NO"
        - CODE_SIGN_ENTITLEMENTS=""
        - CODE_SIGNING_ALLOWED="NO"
      osx_image: xcode12
      script:
        - cd lexilla/src/Lexilla
        - xcodebuild -project Lexilla.xcodeproj
        - cd ../../scripts
        - ./RunTest.sh
    - os: windows
      install:
        - choco install -y visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
      script:
        - export CXX=cl.exe
        - cd lexilla/scripts
        - CI=1 CXX=$CXX ./RunTest.bat
